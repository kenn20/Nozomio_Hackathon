[project]
name = "cogwatch"
version = "0.1.0"
description = "CogWatch — Human Context Rot Detector with Multi-Persona Advisory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tensorlake>=0.5.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "mlflow>=2.13.0",
    "python-dotenv>=1.0.0",
    "GitPython>=3.1.43",
    "hyperspell>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
